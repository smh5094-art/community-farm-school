<?xml version="1.0" encoding="UTF-8"?>
<!--
  Community Farm School — The Giving Tree Poster
  Designed at 1600 × 2000 (5:4 portrait ratio, prints well at 11x17 or letter).
  Tree image: 540 wide × 1080 high (~original 887:1774 ratio), centered.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 2000"
     preserveAspectRatio="xMidYMid meet"
     font-family="'Nunito', 'Nunito Sans', system-ui, sans-serif">

  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6e9"/>
      <stop offset="100%" stop-color="#f3ead3"/>
    </linearGradient>
    <linearGradient id="matchPillBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf3e3"/>
      <stop offset="100%" stop-color="#f3e6c4"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect x="0" y="0" width="1600" height="2000" fill="url(#paperBg)"/>
  <!-- Decorative border -->
  <rect x="30" y="30" width="1540" height="1940" fill="none"
        stroke="#c8a866" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Header -->
  <g transform="translate(800, 100)" text-anchor="middle">
    <text y="0" font-size="20" font-weight="800" fill="#8a5a2b" letter-spacing="6">
      COMMUNITY FARM SCHOOL · CARLISLE, MA
    </text>
    <text y="56" font-size="52" font-weight="900" fill="#1f1c17" letter-spacing="-1">
      The Giving Tree
    </text>
    <text y="98" font-size="22" font-weight="600" fill="#5d574c">
      Find your place — from the roots to the crown
    </text>
  </g>

  <!-- Tree image: 540 wide × 1080 tall, x=530..1070, y=210..1290 -->
  <image xlink:href="giving-tree-v2.png" href="giving-tree-v2.png"
         x="530" y="210" width="540" height="1080"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- ============================================================
       Tree zone y-coordinates (approx, in viewport space)
       Crown (sun rays):       y ≈ 280
       Upper canopy (apples):  y ≈ 400
       Inner canopy (oranges): y ≈ 530
       Upper branches:         y ≈ 680
       Mid branches:           y ≈ 800
       Lower branches:         y ≈ 920
       Upper trunk:            y ≈ 1020
       Lower trunk:            y ≈ 1130
       Soil/seedlings:         y ≈ 1210
       Roots:                  y ≈ 1280
       ============================================================ -->

  <!-- ============================================================
       LEFT COLUMN
       ============================================================ -->

  <!-- Crown / Naming Sponsor -->
  <g transform="translate(40, 220)">
    <text font-size="14" font-weight="800" fill="#c89c4f" letter-spacing="3">CROWN &amp; SUN</text>
    <text y="34" font-size="28" font-weight="900" fill="#1f1c17">Naming Sponsor</text>
    <text y="64" font-size="24" font-weight="800" fill="#c89c4f">$250,000+</text>
    <text y="92" font-size="14" fill="#3a342a">Lend your name to the campaign or</text>
    <text y="111" font-size="14" fill="#3a342a">market in perpetuity. One private event</text>
    <text y="130" font-size="14" fill="#3a342a">per year for the life of the school.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $500,000 IMPACT
    </text>
  </g>
  <line x1="305" y1="280" x2="530" y2="280" stroke="#c89c4f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="530" cy="280" r="5" fill="#c89c4f"/>

  <!-- Inner Canopy / Harvest Patron -->
  <g transform="translate(40, 480)">
    <text font-size="14" font-weight="800" fill="#6b9650" letter-spacing="3">INNER CANOPY</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Harvest Patron · Platinum</text>
    <text y="64" font-size="24" font-weight="800" fill="#6b9650">$50,000</text>
    <text y="92" font-size="14" fill="#3a342a">Co-naming on a major feature</text>
    <text y="111" font-size="14" fill="#3a342a">(greenhouse, hobbit house, coop).</text>
    <text y="130" font-size="14" fill="#3a342a">Private event yearly for 5 years.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $100,000 IMPACT
    </text>
  </g>
  <line x1="305" y1="540" x2="530" y2="540" stroke="#6b9650" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="530" cy="540" r="5" fill="#6b9650"/>

  <!-- Mid Branches / Harvest Silver -->
  <g transform="translate(40, 740)">
    <text font-size="14" font-weight="800" fill="#3d6b2e" letter-spacing="3">MID BRANCHES</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Harvest · Silver</text>
    <text y="64" font-size="24" font-weight="800" fill="#3d6b2e">$10,000 – $24,999</text>
    <text y="92" font-size="14" fill="#3a342a">Funds a full scholarship or major farm</text>
    <text y="111" font-size="14" fill="#3a342a">infrastructure project. Engraved plank</text>
    <text y="130" font-size="14" fill="#3a342a">on the welcome bridge.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $50,000 IMPACT
    </text>
  </g>
  <line x1="305" y1="800" x2="530" y2="800" stroke="#3d6b2e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="530" cy="800" r="5" fill="#3d6b2e"/>

  <!-- Upper Trunk / Sprout -->
  <g transform="translate(40, 1000)">
    <text font-size="14" font-weight="800" fill="#8a5a2b" letter-spacing="3">UPPER TRUNK</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Sprout</text>
    <text y="64" font-size="24" font-weight="800" fill="#8a5a2b">$2,500 – $4,999</text>
    <text y="92" font-size="14" fill="#3a342a">Partial scholarship support for a family</text>
    <text y="111" font-size="14" fill="#3a342a">in need. Listed on the giving-tree wall</text>
    <text y="130" font-size="14" fill="#3a342a">and in the donor program.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $10,000 IMPACT
    </text>
  </g>
  <line x1="305" y1="1060" x2="530" y2="1060" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="530" cy="1060" r="5" fill="#8a5a2b"/>

  <!-- Roots / Friend of the Farm -->
  <g transform="translate(40, 1220)">
    <text font-size="14" font-weight="800" fill="#4a3a22" letter-spacing="3">ROOTS</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Friend of the Farm</text>
    <text y="64" font-size="24" font-weight="800" fill="#4a3a22">$250 – $499</text>
    <text y="92" font-size="14" fill="#3a342a">Every great tree starts with roots.</text>
    <text y="111" font-size="14" fill="#3a342a">Supports daily classroom operations.</text>
    <text y="130" font-size="14" fill="#3a342a">Welcome to the annual open-farm day.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $1,000 IMPACT
    </text>
  </g>
  <line x1="305" y1="1290" x2="530" y2="1290" stroke="#4a3a22" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="530" cy="1290" r="5" fill="#4a3a22"/>

  <!-- ============================================================
       RIGHT COLUMN
       ============================================================ -->

  <!-- Upper Canopy / Legacy Partner -->
  <g transform="translate(1110, 340)">
    <text font-size="14" font-weight="800" fill="#5d8c45" letter-spacing="3">UPPER CANOPY</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Legacy Partner · Diamond</text>
    <text y="64" font-size="24" font-weight="800" fill="#5d8c45">$100,000</text>
    <text y="92" font-size="14" fill="#3a342a">Lead naming on a yurt classroom or</text>
    <text y="111" font-size="14" fill="#3a342a">welcome bridge. Permanent plaque,</text>
    <text y="130" font-size="14" fill="#3a342a">private event yearly for 10 years.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $200,000 IMPACT
    </text>
  </g>
  <line x1="1070" y1="400" x2="1110" y2="400" stroke="#5d8c45" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="1070" cy="400" r="5" fill="#5d8c45"/>

  <!-- Upper Branches / Founders Circle -->
  <g transform="translate(1110, 620)">
    <text font-size="14" font-weight="800" fill="#3d6b2e" letter-spacing="3">UPPER BRANCHES</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Founders Circle · Gold</text>
    <text y="64" font-size="24" font-weight="800" fill="#3d6b2e">$25,000</text>
    <text y="92" font-size="14" fill="#3a342a">Named feature on the property —</text>
    <text y="111" font-size="14" fill="#3a342a">bridge plank, yurt deck, or playground</text>
    <text y="130" font-size="14" fill="#3a342a">element. Yearly event for 3 years.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $50,000 IMPACT
    </text>
  </g>
  <line x1="1070" y1="680" x2="1110" y2="680" stroke="#3d6b2e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="1070" cy="680" r="5" fill="#3d6b2e"/>

  <!-- Lower Branches / Sapling -->
  <g transform="translate(1110, 860)">
    <text font-size="14" font-weight="800" fill="#3d6b2e" letter-spacing="3">LOWER BRANCHES</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Sapling · Bronze</text>
    <text y="64" font-size="24" font-weight="800" fill="#3d6b2e">$5,000 – $9,999</text>
    <text y="92" font-size="14" fill="#3a342a">Supports a full season of materials</text>
    <text y="111" font-size="14" fill="#3a342a">and tools for one classroom. Donor</text>
    <text y="130" font-size="14" fill="#3a342a">wall and giving-tree wall recognition.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $20,000 IMPACT
    </text>
  </g>
  <line x1="1070" y1="920" x2="1110" y2="920" stroke="#3d6b2e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="1070" cy="920" r="5" fill="#3d6b2e"/>

  <!-- Lower Trunk / Seedling -->
  <g transform="translate(1110, 1080)">
    <text font-size="14" font-weight="800" fill="#8a5a2b" letter-spacing="3">LOWER TRUNK</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Seedling</text>
    <text y="64" font-size="24" font-weight="800" fill="#8a5a2b">$1,000 – $2,499</text>
    <text y="92" font-size="14" fill="#3a342a">Sponsors outdoor gear and classroom</text>
    <text y="111" font-size="14" fill="#3a342a">materials for one semester. Listed on</text>
    <text y="130" font-size="14" fill="#3a342a">the giving-tree wall.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $5,000 IMPACT
    </text>
  </g>
  <line x1="1070" y1="1140" x2="1110" y2="1140" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="1070" cy="1140" r="5" fill="#8a5a2b"/>

  <!-- Soil / Patron of the Farm -->
  <g transform="translate(1110, 1310)">
    <text font-size="14" font-weight="800" fill="#6a5535" letter-spacing="3">SOIL</text>
    <text y="34" font-size="26" font-weight="900" fill="#1f1c17">Patron of the Farm</text>
    <text y="64" font-size="24" font-weight="800" fill="#6a5535">$500 – $999</text>
    <text y="92" font-size="14" fill="#3a342a">Helps purchase a season’s worth of</text>
    <text y="111" font-size="14" fill="#3a342a">seeds, soil, and small-scale tools.</text>
    <text y="130" font-size="14" fill="#3a342a">Listed on the giving-tree wall.</text>
    <rect x="0" y="146" width="260" height="24" rx="12" fill="url(#matchPillBg)"/>
    <text x="130" y="162" font-size="12" font-weight="800" fill="#8a5a2b" text-anchor="middle">
      WITH MATCH: UP TO $2,000 IMPACT
    </text>
  </g>
  <line x1="1070" y1="1230" x2="1110" y2="1370" stroke="#6a5535" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="1070" cy="1230" r="5" fill="#6a5535"/>

  <!-- ============================================================
       Footer block — match challenge + contact
       ============================================================ -->
  <!-- gold ribbon -->
  <rect x="100" y="1450" width="1400" height="180" rx="14" fill="#f7efd9" stroke="#c8a866" stroke-width="2"/>
  <g transform="translate(800, 1500)" text-anchor="middle">
    <text font-size="18" font-weight="800" fill="#8a5a2b" letter-spacing="5">
      $250,000 MATCHING CHALLENGE
    </text>
    <text y="42" font-size="32" font-weight="900" fill="#1f1c17">
      Every gift is doubled — up to $250,000.
    </text>
    <text y="78" font-size="18" font-weight="600" fill="#3a342a">
      An anonymous founding donor matches every dollar, dollar-for-dollar.
    </text>
    <text y="106" font-size="16" fill="#5d574c">
      A $1,000 Seedling becomes $2,000. A $50,000 Harvest Patron becomes $100,000.
    </text>
  </g>

  <!-- Contact footer -->
  <g transform="translate(800, 1730)" text-anchor="middle">
    <text font-size="20" font-weight="900" fill="#1f1c17">Community Farm School</text>
    <text y="32" font-size="15" fill="#3a342a">201 Bedford Road · Carlisle, MA 01741</text>
    <text y="58" font-size="15" fill="#3a342a">
      jenna.hull@communityfarmschool.com · 781-956-7836 · communityfarmschool.com
    </text>
    <text y="92" font-size="12" fill="#8d877a" font-style="italic">
      Community Farm School is a 501(c)(3) nonprofit. All gifts are tax-deductible.
    </text>
  </g>
</svg>
